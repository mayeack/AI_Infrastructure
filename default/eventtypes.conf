#
# eventtypes.conf - ai_infra_monitoring
# One eventtype per layer of the AI stack (no pipes, no subsearches).
#

[ai_layer_compute]
search = index=ai_infra (sourcetype=ai:gpu:fault OR sourcetype=cisco:ucs:alarm OR sourcetype=cisco:ucs:inventory OR sourcetype=cisco:ucs:audit)
description = Layer 01 Compute and storage: GPU faults and Cisco UCS server events
priority = 1
color = et_blue

[ai_layer_network]
search = index=ai_network (sourcetype=cisco:nexus:interface OR sourcetype=cisco:nexus:anomaly OR sourcetype=cisco:nexus:config OR sourcetype=ai:path:test)
description = Layer 02 Network: Cisco Nexus fabric interfaces, anomalies, config changes and path tests
priority = 2
color = et_green

[ai_layer_platform]
search = index=ai_platform (sourcetype=kube:events OR sourcetype=ai:inference:server OR sourcetype=ai:job:lifecycle)
description = Layer 03 Platform: Kubernetes events, inference servers and job lifecycle
priority = 3
color = et_teal

[ai_layer_application]
search = index=ai_application (sourcetype=gen_ai:request OR sourcetype=gen_ai:guardrail)
description = Layer 04 Applications: requests and guardrail events
priority = 4
color = et_orange

[ai_layer_model]
search = index=ai_model_eval sourcetype=ai:eval:run
description = Layer 05 Models: evaluation runs
priority = 5
color = et_magenta

[ai_layer_agent]
search = index=ai_application (sourcetype=gen_ai:agent:run OR sourcetype=gen_ai:agent:step)
description = Layer 06 Agents: agent runs and steps
priority = 6
color = et_purple
