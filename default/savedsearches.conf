description = Look first at Guardrails Triggered on AI Applications and the guardrail rows for the application; a 15-minute count above three times the 24-hour average means either a prompt-injection campaign or a model drifting into flagged answers.
search = `ai_guardrails` verdict IN (flagged,blocked) \
    | eval bucket=if(_time>=relative_time(now(),"-15m@m"),"cur","base") \
    | stats count(eval(bucket="cur")) AS count count(eval(bucket="base")) AS base_total values(eval(if(bucket="cur",category,null()))) AS category BY gen_ai.app \
    | rename gen_ai.app AS app \
    | eval baseline=round(base_total/95,1) \
    | where count>3*baseline \
    | eval dashboard="ai_agents", layer="agent", severity_label="high"
