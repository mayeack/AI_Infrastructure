[AI Infra - Idle GPU capacity above 30% for 24h]
description = Look first at Idle GPU-Hours and the cost table on AI Infrastructure Health and AI Cost and Unit Economics; unallocated GPUs in this AI POD exceeded 30% of metric datapoints over the last 24 hours and should be reassigned or released.
search = | mstats count(DCGM_FI_DEV_GPU_UTIL) AS datapoints WHERE `ai_gpu_metrics` BY ai_pod workload \
    | eval idle=if(workload="unallocated",datapoints,0) \
    | stats sum(idle) AS idle sum(datapoints) AS total BY ai_pod \
    | eval idle_pct=round(100*idle/total,1) \
    | where idle_pct>30 \
    | eval dashboard="ai_infrastructure_health", layer="compute", severity_label="low"
