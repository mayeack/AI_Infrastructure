[AI Apps - Error rate spike]
description = Look first at Availability and the request table on AI Applications; an error share above 0.15% for one application in the last 15 minutes is usually upstream (retrieval, model server) and shows as status error or timeout on the same trace_id.
search = `ai_requests` \
    | stats sum(request_count) AS requests sum(eval(if(status IN ("error","timeout"),request_count,0))) AS errors BY gen_ai.app \
    | rename gen_ai.app AS app \
    | eval error_pct=round(100*errors/requests,2) \
    | where error_pct>0.15 \
