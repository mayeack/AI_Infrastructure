[AI Models - Quality drift vs baseline]
description = Look first at Hallucination Flags per 1,000 Responses on Model Performance and Quality; a 15-minute rate more than twice the 24-hour baseline for one model is drift in production, and the evaluation table shows whether a release is involved.
search = `ai_requests` \
    | eval bucket=if(_time>=relative_time(now(),"-15m@m"),"cur","base") \
    | stats sum(hallucination_count) AS flagged sum(request_count) AS requests BY gen_ai.request.model bucket \
    | eval rate=flagged/requests \
    | rename gen_ai.request.model AS model \
    | xyseries model bucket rate \
    | eval per_1000=round(cur*1000,1), baseline_per_1000=round(base*1000,1) \
    | where cur>2*base \
    | eval dashboard="model_performance_quality", layer="model", severity_label="medium"
