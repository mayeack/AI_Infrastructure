[AI Network - Fabric congestion (ECN/PFC) on an AI POD link]
description = Look first at the device and interface on AI Network Fabric (Links and Paths Needing Attention): ECN marking or PFC pause storms at 90%+ utilization stall RoCE traffic for every GPU behind the link; check for a recent QoS change on the switch.
search = `ai_nexus_anomaly` anomaly IN (congestion,pfc_pause_storm,"ecn_marked_packets high") \
    | stats max(utilization) AS utilization count AS events latest(severity) AS severity BY device interface peer anomaly ai_pod \
    | where utilization>=90 \
    | eval dashboard="ai_network_fabric", layer="network", severity_label="high"
