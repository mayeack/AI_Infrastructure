#
# savedsearches.conf - ai_infra_monitoring
#
# 25 alerts (titles verbatim from the spec) -> logevent to index=ai_summary sourcetype=ai:alert,
# one ai:alert event per result (alert.digest_mode=0). Every search ends with
# | eval dashboard=..., layer=..., severity_label=... so the alert log carries them.
# The four AI Security alerts also write ai:security:finding rows via | collect.
# 5 "AI Scoreboard - <Name>" rollups -> index=ai_summary sourcetype=ai:scoreboard every 15 min.
# 4 "<title> - Rule" Enterprise Security twins ship disabled (tools/enable_es.py).
# Base and KPI macros live in default/macros.conf; the incident recurs 12:45-15:00 local daily.
#

###############################################################################
# Alerts
###############################################################################

[AI Infra - ECC or Xid faults on a GPU node]
description = Look first at the node and GPU in the result on AI Infrastructure Health (Nodes Needing Attention): ECC double-bit or Xid faults mean the GPU has fallen off the bus or is corrupting memory; check the fabric_link state and drain the node.
search = `ai_gpu_fault` fault IN (ecc_dbe_volatile,xid_79_fallen_off_bus,xid_48_dbe) \
    | stats count AS faults values(fault) AS fault max(gpu_temp_c) AS gpu_temp_c latest(fabric_link) AS fabric_link latest(fabric_link_state) AS fabric_link_state latest(node_state) AS node_state BY node ai_pod gpu \
    | eval dashboard="ai_infrastructure_health", layer="compute", severity_label="high"
cron_schedule = */5 * * * *
dispatch.earliest_time = -15m@m
dispatch.latest_time = now
enableSched = 1
schedule_window = auto
realtime_schedule = 0
alert.track = 1
alert.digest_mode = 0
alert.severity = 4
counttype = number of events
relation = greater than
quantity = 0
action.email = 0
action.logevent = 1
action.logevent.param.index = ai_summary
action.logevent.param.sourcetype = ai:alert
action.logevent.param.source = alert:$name$
action.logevent.param.host = ai-demo-generator
action.logevent.param.event = search_name="$name$" severity=$result.severity_label$ layer=$result.layer$ dashboard=$result.dashboard$ node="$result.node$" ai_pod="$result.ai_pod$" gpu="$result.gpu$" fault="$result.fault$" gpu_temp_c="$result.gpu_temp_c$" fabric_link="$result.fabric_link$" node_state="$result.node_state$"

[AI Infra - Thermal throttling sustained 15 min]
description = Look first at the GPU temperature trend for the node on AI Infrastructure Health; three consecutive 5-minute buckets of thermal_throttle mean cooling or airflow, not load, and the node should be inspected.
search = `ai_gpu_fault` fault=thermal_throttle \
    | bin _time span=5m \
    | stats max(gpu_temp_c) AS gpu_temp_c dc(_time) AS buckets BY node ai_pod gpu \
    | where buckets>=3 \
    | eval dashboard="ai_infrastructure_health", layer="compute", severity_label="medium"
