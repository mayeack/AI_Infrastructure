[AI Cost - Daily spend spike by business unit]
description = Look first at GPU-Hours by Business Unit on AI Cost and Unit Economics; a day-over-day spend increase above 15% for one business unit is usually a rerun fine-tuning job or a new workload, visible in the cost table.
search = `ai_cost_daily` workload!=unallocated \
    | bin _time span=1d \
    | stats sum(est_cost_usd) AS spend BY _time business_unit \
    | sort 0 business_unit _time \
    | streamstats current=f last(spend) AS prior BY business_unit \
    | eval spend=round(spend), prior=round(prior), change_pct=round(100*(spend-prior)/prior,1) \
    | where change_pct>15 \
    | eval dashboard="ai_cost_unit_economics", layer="cost", severity_label="medium"
cron_schedule = */15 * * * *
dispatch.earliest_time = -3d@d
