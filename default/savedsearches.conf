[AI Cost - Idle reservation above threshold]
description = Look first at Idle GPU-Hours and Top Workloads by Cost on AI Cost and Unit Economics; unallocated capacity above 20% of an AI POD, or a workload running below 50% utilization, is reclaimable spend.
search = `ai_cost_daily` \
    | fillnull value="unallocated" business_unit \
    | stats sum(gpu_hours) AS gpu_hours sum(idle_gpu_hours) AS idle_gpu_hours avg(avg_gpu_util) AS avg_gpu_util BY ai_pod workload business_unit \
    | eventstats sum(gpu_hours) AS pod_gpu_hours sum(idle_gpu_hours) AS pod_idle_gpu_hours BY ai_pod \
    | eval idle_ratio=if(workload="unallocated", round(pod_idle_gpu_hours/(pod_gpu_hours+pod_idle_gpu_hours),2), round((100-avg_gpu_util)/100,2)), reason=if(workload="unallocated","unallocated reservation","low utilization") \
    | where (workload="unallocated" AND idle_ratio>0.2) OR (workload!="unallocated" AND idle_ratio>0.5) \
    | table ai_pod workload business_unit gpu_hours idle_gpu_hours avg_gpu_util idle_ratio reason \
    | eval dashboard="ai_cost_unit_economics", layer="cost", severity_label="low"
