[AI Apps - p95 time-to-first-token regression]
description = Look first at the Time-to-First-Token chart on AI Applications; a p95 more than 1.5x the prior 24 hours for one application points at its model server queue or retrieval path, not the model.
search = `ai_requests` \
    | eval bucket=case(_time>=relative_time(now(),"-15m@m"),"cur", _time<relative_time(now(),"-2h@m"),"prior") \
    | where isnotnull(bucket) \
    | stats perc95(ttft_ms) AS p95 BY gen_ai.app bucket \
    | rename gen_ai.app AS app \
    | xyseries app bucket p95 \
    | eval cur=round(cur), prior=round(prior) \
    | where cur>1.5*prior \
    | eval dashboard="ai_applications", layer="application", severity_label="high"
