#
# tags.conf - ai_infra_monitoring
# Layer tags on the eventtypes and on the calculated "layer" field.
#

[eventtype=ai_layer_compute]
ai_layer = enabled
compute = enabled

[eventtype=ai_layer_network]
ai_layer = enabled
network = enabled

[eventtype=ai_layer_platform]
ai_layer = enabled
platform = enabled

[eventtype=ai_layer_application]
ai_layer = enabled
application = enabled

[eventtype=ai_layer_model]
ai_layer = enabled
model = enabled

[eventtype=ai_layer_agent]
ai_layer = enabled
agent = enabled

[layer=compute]
ai_layer = enabled

[layer=network]
ai_layer = enabled

[layer=platform]
ai_layer = enabled

[layer=application]
ai_layer = enabled

[layer=model]
ai_layer = enabled

[layer=agent]
ai_layer = enabled
