#
# inputs.conf - ai_infra_monitoring
#
# One scripted-input stanza per sourcetype. All ship disabled (Splunk Cloud safe;
# scripted inputs in private apps need vetting there). On Splunk Enterprise enable
# ai:gpu:metrics plus the four biggest event feeds (gen_ai:request,
# cisco:nexus:interface, gen_ai:agent:step, gen_ai:agent:run) via local/inputs.conf
# (make enable-stream) or the UI; the README lists the rest.
# python.version satisfies appinspect; python.required (3.9, 3.13) wins at runtime on 10.x.
#

[script://$SPLUNK_HOME/etc/apps/ai_infra_monitoring/bin/ai_demo_generator.py --stream --sourcetype ai:gpu:metrics]
disabled = 1
interval = 60
python.version = python3
python.required = 3.9, 3.13
index = ai_infra_metrics
sourcetype = ai:gpu:metrics
source = ai_demo_generator_metrics
host = ai-demo-generator

