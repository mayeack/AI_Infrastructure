# macros.conf - ai_infra_monitoring
# Single source of truth for every dashboard tile, scoreboard rollup and smoke check.
# Base macros pin host=ai-demo-generator so demo data can be removed cleanly.
# KPI macros return exactly one row with a single field "value"; the time window
# always comes from the caller (dashboard token or dispatch.earliest_time).

# ---------------------------------------------------------------- base: index-level
[ai_infra_idx]
definition = (index=ai_infra host=ai-demo-generator)

[ai_network_idx]
definition = (index=ai_network host=ai-demo-generator)

[ai_platform_idx]
definition = (index=ai_platform host=ai-demo-generator)

[ai_gen_ai_idx]
definition = (index=ai_application host=ai-demo-generator)

[ai_eval_idx]
definition = (index=ai_model_eval host=ai-demo-generator)

[ai_cost_idx]
definition = (index=ai_cost host=ai-demo-generator)

[ai_security_idx]
definition = (index=ai_security host=ai-demo-generator)

[ai_summary_idx]
definition = (index=ai_summary host=ai-demo-generator)

# ---------------------------------------------------------------- base: sourcetype-level
[ai_gpu_metrics]
definition = (index=ai_infra_metrics host=ai-demo-generator)

[ai_gpu_fault]
definition = (index=ai_infra sourcetype=ai:gpu:fault host=ai-demo-generator)

[ai_ucs]
definition = (index=ai_infra host=ai-demo-generator sourcetype IN ("cisco:ucs:alarm","cisco:ucs:inventory","cisco:ucs:audit"))

[ai_nexus_interface]
definition = (index=ai_network sourcetype=cisco:nexus:interface host=ai-demo-generator)

[ai_nexus_anomaly]
definition = (index=ai_network sourcetype=cisco:nexus:anomaly host=ai-demo-generator)

[ai_nexus_config]
definition = (index=ai_network sourcetype=cisco:nexus:config host=ai-demo-generator)

[ai_path_test]
definition = (index=ai_network sourcetype=ai:path:test host=ai-demo-generator)

[ai_kube_events]
definition = (index=ai_platform sourcetype=kube:events host=ai-demo-generator)

[ai_inference_server]
definition = (index=ai_platform sourcetype=ai:inference:server host=ai-demo-generator)

[ai_job_lifecycle]
definition = (index=ai_platform sourcetype=ai:job:lifecycle host=ai-demo-generator)

[ai_requests]
definition = (index=ai_application sourcetype=gen_ai:request host=ai-demo-generator)

[ai_agent_runs]
definition = (index=ai_application sourcetype=gen_ai:agent:run host=ai-demo-generator)

[ai_agent_steps]
definition = (index=ai_application sourcetype=gen_ai:agent:step host=ai-demo-generator)

[ai_guardrails]
definition = (index=ai_application sourcetype=gen_ai:guardrail host=ai-demo-generator)

[ai_eval_runs]
definition = (index=ai_model_eval sourcetype=ai:eval:run host=ai-demo-generator)

[ai_cost_daily]
definition = (index=ai_cost sourcetype=ai:cost:daily host=ai-demo-generator)

[ai_cost_tokens]
definition = (index=ai_cost sourcetype=ai:cost:tokens host=ai-demo-generator)

[ai_security_findings]
definition = (index=ai_security sourcetype=ai:security:finding host=ai-demo-generator)

[ai_security_raw]
definition = (index=ai_security host=ai-demo-generator sourcetype IN ("aws:cloudtrail:sim","k8s:audit:sim","iam:sim"))

[ai_scoreboard]
definition = (index=ai_summary sourcetype=ai:scoreboard host=ai-demo-generator)

[ai_incidents]
definition = (index=ai_summary sourcetype=ai:incident host=ai-demo-generator)

[ai_alerts]
definition = (index=ai_summary sourcetype=ai:alert)

# ---------------------------------------------------------------- KPI: 1 ai_infrastructure_health
[ai_kpi_gpus_monitored(2)]
args = pod,node
definition = mstats latest(DCGM_FI_DEV_GPU_UTIL) AS u WHERE `ai_gpu_metrics` ai_pod IN ($pod$) node="$node$" BY node gpu | stats count AS value | fields value

[ai_kpi_gpu_util_avg(2)]
args = pod,node
definition = mstats avg(DCGM_FI_DEV_GPU_UTIL) AS value WHERE `ai_gpu_metrics` ai_pod IN ($pod$) node="$node$" NOT workload="unallocated" | eval value=round(value,1) | fields value

[ai_kpi_idle_gpu_hours_7d(1)]
args = pod
definition = `ai_cost_daily` ai_pod IN ($pod$) | stats sum(idle_gpu_hours) AS value | eval value=round(value,0) | fields value

[ai_kpi_degraded_nodes(2)]
args = pod,node
definition = `ai_gpu_fault` ai_pod IN ($pod$) node="$node$" | stats latest(node_state) AS node_state BY node | where node_state="degraded" | stats count AS value | fields value

[ai_kpi_ecc_xid_errors(2)]
args = pod,node
definition = `ai_gpu_fault` ai_pod IN ($pod$) node="$node$" (fault="ecc_*" OR fault="xid_*") | stats count AS value | fields value

# ---------------------------------------------------------------- KPI: 2 ai_network_fabric
[ai_kpi_fabric_links(1)]
args = fabric
definition = `ai_nexus_interface` ai_pod IN ($fabric$) | stats dc(fabric_link_id) AS value | fields value

[ai_kpi_congested_links(1)]
args = fabric
definition = `ai_nexus_anomaly` ai_pod IN ($fabric$) anomaly IN ("congestion","pfc_pause_storm","ecn_marked_packets high") | stats dc(fabric_link_id) AS value | fields value

[ai_kpi_pfc_pause_frames(1)]
args = fabric
definition = `ai_nexus_interface` ai_pod IN ($fabric$) | stats sum(pfc_pause_rx) AS rx sum(pfc_pause_tx) AS tx | eval value=coalesce(rx,0)+coalesce(tx,0) | fields value

[ai_kpi_link_flaps(1)]
args = fabric
definition = `ai_nexus_anomaly` ai_pod IN ($fabric$) anomaly=link_flap | stats sum(flap_count) AS value | fields value

[ai_kpi_p95_model_api_latency]
definition = `ai_path_test` target=api.model-provider.example | stats perc95(latency_ms) AS value | eval value=round(value,0) | fields value

# ---------------------------------------------------------------- KPI: 3 ai_platform_workloads
[ai_kpi_inference_replicas]
definition = `ai_inference_server` | stats latest(replicas_running) AS r BY model_server | stats sum(r) AS value | fields value

[ai_kpi_pod_restarts(2)]
args = ns,workload
definition = `ai_kube_events` namespace IN ($ns$) workload="$workload$" reason IN ("OOMKilled","NodeNotReady","CrashLoopBackOff","Evicted") | stats sum(restart_count) AS value | fields value

[ai_kpi_pending_gpu_pods]
definition = `ai_inference_server` | bin _time span=1m | stats sum(pending_gpu_pods) AS p BY _time | stats max(p) AS value | fields value

[ai_kpi_p95_queue_time]
definition = `ai_inference_server` | stats perc95(queue_time_p95_ms) AS ms | eval value=round(ms/1000,1) | fields value

[ai_kpi_failed_jobs_7d]
definition = `ai_job_lifecycle` state=failed | stats dc(job_id) AS value | fields value

# ---------------------------------------------------------------- KPI: 4 ai_applications
[ai_kpi_requests(2)]
args = app,model
definition = `ai_requests` gen_ai.app IN ($app$) gen_ai.request.model IN ($model$) | stats sum(request_count) AS value | fields value

[ai_kpi_availability(2)]
args = app,model
definition = `ai_requests` gen_ai.app IN ($app$) gen_ai.request.model IN ($model$) | stats sum(request_count) AS total sum(eval(if(status IN ("error","timeout"),request_count,0))) AS errors | eval value=round(100*(1-errors/total),2) | fields value

[ai_kpi_p95_ttft(2)]
args = app,model
definition = `ai_requests` gen_ai.app IN ($app$) gen_ai.request.model IN ($model$) | stats perc95(ttft_ms) AS value | eval value=round(value,0) | fields value

[ai_kpi_token_spend(2)]
args = app,model
definition = `ai_requests` gen_ai.app IN ($app$) gen_ai.request.model IN ($model$) | stats sum(cost_usd) AS value | eval value=round(value,2) | fields value

[ai_kpi_guardrails_triggered(1)]
args = app
definition = `ai_guardrails` gen_ai.app IN ($app$) verdict IN ("flagged","blocked") | stats count AS value | fields value

# ---------------------------------------------------------------- KPI: 5 model_performance_quality
[ai_kpi_safety_compliance(1)]
args = model
definition = `ai_requests` gen_ai.request.model IN ($model$) | stats avg(quality.safety_score) AS value | eval value=round(value,1) | fields value

[ai_kpi_groundedness(1)]
args = model
definition = `ai_requests` gen_ai.request.model IN ($model$) | stats avg(quality.groundedness) AS value | eval value=round(value,1) | fields value

[ai_kpi_hallucination_rate(1)]
args = model
definition = `ai_requests` gen_ai.request.model IN ($model$) gen_ai.request.model!="rag-embed-v7" | eval h=coalesce(hallucination_count, 'quality.hallucination_flag'*request_count) | stats sum(h) AS h sum(request_count) AS n | eval value=round(100*h/n,1) | fields value

[ai_kpi_score_drift]
definition = `ai_eval_runs` suite=reasoning | eval vnum=tonumber(replace(version,"v","")) | sort 0 - vnum - _time | head 1 | eval value=round(delta_vs_baseline,1) | fields value

[ai_kpi_eval_cycle_time]
definition = `ai_eval_runs` | stats avg(cycle_time_h) AS value | eval value=round(value,1) | fields value

[ai_kpi_eval_pass_rate]
definition = `ai_eval_runs` | stats avg(pass_rate) AS value | eval value=round(value,1) | fields value

[ai_kpi_pilot_to_production]
definition = inputlookup ai_application_catalog | eval d=round((strptime(production_date,"%Y-%m-%d")-strptime(pilot_start_date,"%Y-%m-%d"))/86400) | stats median(d) AS value | fields value

# ---------------------------------------------------------------- KPI: 6 ai_agents
[ai_kpi_agent_runs(2)]
args = agent,outcome
definition = `ai_agent_runs` gen_ai.agent.name IN ($agent$) outcome IN ($outcome$) | stats count AS value | fields value

[ai_kpi_task_completion(1)]
args = agent
definition = `ai_agent_runs` gen_ai.agent.name IN ($agent$) | stats count AS total count(eval(outcome="completed")) AS done | eval value=round(100*done/total,1) | fields value

[ai_kpi_avg_steps(1)]
args = agent
definition = `ai_agent_runs` gen_ai.agent.name IN ($agent$) outcome=completed | stats avg(steps) AS value | eval value=round(value,1) | fields value

[ai_kpi_tool_call_failures(1)]
args = agent
definition = `ai_agent_steps` gen_ai.agent.name IN ($agent$) gen_ai.operation.name=execute_tool status=error | stats count AS value | fields value

[ai_kpi_runaway_loops(1)]
args = agent
definition = `ai_agent_runs` gen_ai.agent.name IN ($agent$) outcome=loop_stopped | stats count AS value | fields value

# ---------------------------------------------------------------- KPI: 7 ai_cost_unit_economics
[ai_kpi_gpu_hours_allocated_7d(1)]
args = bu
definition = `ai_cost_daily` business_unit IN ($bu$) | stats sum(gpu_hours) AS value | eval value=round(value,0) | fields value

[ai_kpi_cost_per_1m_tokens_selfhosted]
definition = `ai_cost_tokens` model!="provider-api-large" | stats sum(cost_usd) AS c sum(tokens_millions) AS m | eval value=round(c/m,2) | fields value

[ai_kpi_model_api_spend_7d]
definition = `ai_cost_tokens` model="provider-api-large" | stats sum(cost_usd) AS value | eval value=round(value,0) | fields value

[ai_kpi_tokens_per_gpu_second]
definition = `ai_cost_tokens` model!="provider-api-large" | stats sum(tokens_millions) AS m sum(gpu_seconds) AS s | eval value=round(m*1000000/s,0) | fields value

# ---------------------------------------------------------------- KPI: 8 ai_security_posture
[ai_kpi_open_findings(2)]
args = env,user
definition = `ai_security_findings` environment IN ($env$) user="$user$" | eval fkey=user."|".src."|".object."|".strftime(_time,"%Y%m%d") | stats latest(status) AS status BY fkey | where status="open" | stats count AS value | fields value

[ai_kpi_model_asset_anomalies(2)]
args = env,user
definition = earliest=-7d@d latest=@d `ai_security_findings` environment IN ($env$) user="$user$" category=model_asset_access | eval fkey=user."|".src."|".object."|".strftime(_time,"%Y%m%d") | stats dc(fkey) AS value | fields value

[ai_kpi_credential_misuse(2)]
args = env,user
definition = earliest=-7d@d latest=@d `ai_security_findings` environment IN ($env$) user="$user$" category=credential_misuse | eval fkey=user."|".src."|".object."|".strftime(_time,"%Y%m%d") | stats dc(fkey) AS value | fields value

[ai_kpi_data_movement_alerts(2)]
args = env,user
definition = earliest=-7d@d latest=@d `ai_security_findings` environment IN ($env$) user="$user$" category=data_movement | eval fkey=user."|".src."|".object."|".strftime(_time,"%Y%m%d") | stats dc(fkey) AS value | fields value

[ai_kpi_prompt_injections(1)]
args = env
definition = earliest=-7d@d latest=@d `ai_guardrails` category=prompt_injection verdict=blocked | stats count AS value | fields value

# ---------------------------------------------------------------- 9 executive: scoreboard series
[ai_scoreboard_latest(2)]
args = board,metric
definition = `ai_scoreboard` scoreboard="$board$" metric="$metric$" | timechart span=1d latest(value) AS value | filldown value

# ---------------------------------------------------------------- drilldown: node timeline (acceptance #5)
[ai_node_timeline(1)]
args = node
definition = (index=ai_infra OR index=ai_network OR index=ai_platform) host=ai-demo-generator "$node$" | eval layer=case(index=="ai_infra","01 compute",index=="ai_network","02 network",true(),"03 platform"), element=coalesce(fabric_link,pod,gpu,interface), detail=coalesce(fault,anomaly,reason,message) | table _time layer sourcetype node element detail severity | sort 0 _time

# ---------------------------------------------------------------- anomaly band for the hallucination chart
# Input rows: _time, model, rate (flags per 1,000 responses per bin). Output adds band_mean,
# band_sd, band_upper, band_lower and anomaly (rate when above the band, else null).
# Default: static +/-2 sigma band per model (no MLTK dependency).
[ai_hallucination_band]
definition = eventstats avg(rate) AS band_mean stdev(rate) AS band_sd BY model | eval band_sd=coalesce(band_sd,0), band_upper=round(band_mean+2*band_sd,1), band_lower=round(max(band_mean-2*band_sd,0),1), anomaly=if(rate>band_upper,rate,null())
# AI Toolkit alternate (MLTK 6.0 + PSC; needs run_risky_commands). Swap the definition above for:
# definition = fit DensityFunction rate by "model" threshold=0.01 into app:ai_infra_hallucination_df | eval anomaly=if('IsOutlier(rate)'=1,rate,null()) | rex field=BoundaryRanges "(?<band_lower>[-\d.]+):(?<band_upper>[-\d.]+)" | fields - BoundaryRanges "IsOutlier(rate)" "ProbabilityDensity(rate)"
