#
# transforms.conf - ai_infra_monitoring
#
# Log-to-metrics schema for ai:gpu:metrics (scripted-input / oneshot path) and
# the five CSV lookups shipped in lookups/.
#

[metric-schema:ai_gpu_metrics]
METRIC-SCHEMA-MEASURES = DCGM_FI_DEV_*, storage_*
METRIC-SCHEMA-BLACKLIST-DIMS = timestamp

[gpu_rate_card]
filename = gpu_rate_card.csv
case_sensitive_match = false

[ai_node_inventory]
filename = ai_node_inventory.csv
case_sensitive_match = false
max_matches = 1

[ai_application_catalog]
filename = ai_application_catalog.csv
case_sensitive_match = false

[ai_layer_map]
filename = ai_layer_map.csv
case_sensitive_match = false

[ai_top_risks]
filename = ai_top_risks.csv
case_sensitive_match = false
