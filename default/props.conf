#
# props.conf - ai_infra_monitoring
#
# Every event sourcetype is newline-delimited JSON with an ISO-8601 "timestamp"
# (milliseconds + offset). Search-time JSON extraction (KV_MODE=json) serves both
# the scripted-input path and HEC. Only ai:gpu:metrics uses index-time
# INDEXED_EXTRACTIONS + METRIC-SCHEMA-TRANSFORMS (log-to-metrics for the
# oneshot/scripted path; HEC sends the native metrics JSON form).
#
# Field conventions: "node" is native on ai:gpu:fault, kube:events,
# ai:job:lifecycle and gen_ai:request; aliased from "server" on cisco:ucs:*;
# derived from "peer" on cisco:nexus:* (EVAL, never a FIELDALIAS, so "device"
# stays the switch). "layer" is a calculated field on every sourcetype.
#

###############################################################################
# Layer 1 - Compute and storage (Cisco UCS, Cisco AI PODs)
###############################################################################

[ai:gpu:metrics]
# HEC delivers these as native multi-metric events ("event":"metric" + "fields"), so this stanza must not
# carry index-time parsing or log-to-metrics keys: they would strip the metric fields and the indexer
# would reject the datapoints. The scripted-input / oneshot path emits plain JSON lines under
# source=ai_demo_generator_metrics, which the [source::ai_demo_generator_metrics] stanza converts.
category = Metrics
description = DCGM GPU metrics and per-node storage metrics per minute (ai_pod, node, gpu, workload, kind dimensions)

[source::ai_demo_generator_metrics]
# log-to-metrics conversion for the plain-JSON path (scripted input --stream and `splunk add oneshot`)
INDEXED_EXTRACTIONS = json
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 0
NO_BINARY_CHECK = true
TIME_PREFIX = \"timestamp\"\s*:\s*\"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3N%z
MAX_TIMESTAMP_LOOKAHEAD = 40
METRIC-SCHEMA-TRANSFORMS = metric-schema:ai_gpu_metrics

[ai:gpu:fault]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 0
NO_BINARY_CHECK = true
KV_MODE = json
TIME_PREFIX = \"timestamp\"\s*:\s*\"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3N%z
MAX_TIMESTAMP_LOOKAHEAD = 40
category = Custom
pulldown_type = 1
description = GPU ECC, Xid, NVLink, thermal and power faults per node and GPU
EVAL-layer = "compute"
EVAL-fabric_link_id = fabric_link
EVAL-fault_type = case(match(fault,"^ecc_dbe"),"ecc_dbe", match(fault,"^ecc"),"ecc", match(fault,"^xid"),"xid", match(fault,"nvlink"),"nvlink", match(fault,"thermal"),"thermal_throttle", match(fault,"power"),"power_cap_throttle", true(),"other")
LOOKUP-ai_layer = ai_layer_map sourcetype OUTPUTNEW layer_no dashboard
LOOKUP-ai_node = ai_node_inventory node OUTPUTNEW server_model gpu_model leaf_switch leaf_port cost_center

[cisco:ucs:alarm]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 0
NO_BINARY_CHECK = true
KV_MODE = json
TIME_PREFIX = \"timestamp\"\s*:\s*\"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3N%z
MAX_TIMESTAMP_LOOKAHEAD = 40
category = Custom
