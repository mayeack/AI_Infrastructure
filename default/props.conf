MAX_TIMESTAMP_LOOKAHEAD = 40
category = Custom
pulldown_type = 1
description = Application requests (per-minute aggregate rows carrying request_count plus detail rows) with TTFT, retrieval, guardrail, cost and quality fields
EVAL-layer = "application"
FIELDALIAS-genai = gen_ai.app AS app gen_ai.request.model AS model gen_ai.usage.input_tokens AS input_tokens gen_ai.usage.output_tokens AS output_tokens
EVAL-total_tokens = coalesce('gen_ai.usage.input_tokens',0)+coalesce('gen_ai.usage.output_tokens',0)
EVAL-is_error = if(status IN ("error","timeout"),1,0)
EVAL-error_count = if(status IN ("error","timeout"),coalesce(request_count,1),0)
EVAL-retrieval_timeout = if(retrieval_ms=="timeout",1,0)
LOOKUP-ai_layer = ai_layer_map sourcetype OUTPUTNEW layer_no dashboard
LOOKUP-ai_app = ai_application_catalog gen_ai.app OUTPUTNEW owner tier in_customer_path
LOOKUP-ai_node = ai_node_inventory node OUTPUTNEW server_model gpu_model leaf_switch leaf_port

