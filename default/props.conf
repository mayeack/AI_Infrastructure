KV_MODE = json
TIME_PREFIX = \"timestamp\"\s*:\s*\"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3N%z
MAX_TIMESTAMP_LOOKAHEAD = 40
category = Custom
pulldown_type = 1
description = Cisco Nexus per-interface counters per interval (utilization, ECN, PFC, CRC, link state, optics)
EVAL-layer = "network"
EVAL-node = coalesce(peer, null())
EVAL-fabric_link_id = device.":".interface
EVAL-ai_pod = case(match(device,"^dc1-"),"aipod-dc1", match(device,"^dc2-"),"aipod-dc2", match(device,"^lab-"),"aipod-lab")
EVAL-fabric = case(match(device,"^dc1-"),"aipod-dc1", match(device,"^dc2-"),"aipod-dc2", match(device,"^lab-"),"aipod-lab")
EVAL-pfc_pause_total = coalesce(pfc_pause_rx,0)+coalesce(pfc_pause_tx,0)
EVAL-throughput_gbps = (coalesce(in_util_pct,0)+coalesce(out_util_pct,0))/200*coalesce(speed_gbps,400)
LOOKUP-ai_layer = ai_layer_map sourcetype OUTPUTNEW layer_no dashboard

